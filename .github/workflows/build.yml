# Source validation only. Signing and live-client verification precede binary releases.
name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify actual Lua addon geometry and wire fixtures
        run: |
          python -m pip install lupa==2.6
          python tests/addon_probe_test.py
      - name: Core tests
        run: dotnet run --project tests/SpeakForever.Core.Tests -c Release
      - name: Deterministic routing tests
        run: dotnet run --project tests/VoiceRouter.Tests -c Release
      - name: Compile portable app
        run: dotnet publish app/Gui/SpeakForever.Gui.csproj -c Release --self-contained true --output dist/ForeverRoutedSpeech
